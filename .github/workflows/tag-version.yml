name: Validate and Tag Standard VERSION

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/tag-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read immutable version state
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then IS_NEW=false; else IS_NEW=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_new=$IS_NEW" >> "$GITHUB_OUTPUT"

      - name: Existing standard release is immutable
        if: steps.version.outputs.is_new != 'true'
        run: echo "${{ steps.version.outputs.tag }} already exists; no retagging is allowed."

      - name: Set up Python
        if: steps.version.outputs.is_new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        if: steps.version.outputs.is_new == 'true'
        run: pip install -r requirements-dev.txt

      - name: ISO-aligned automated test process
        if: steps.version.outputs.is_new == 'true'
        run: |
          python tools/standard_audit.py
          python tools/self_test.py
          python tools/quality_contract_test.py
          bash tools/public_repo_guard.sh

      - name: Official WordPress Plugin Check - EDD paid representative
        if: steps.version.outputs.is_new == 'true'
        uses: wordpress/plugin-check-action@v1
        with:
          repo-token: ''
          build-dir: './build/self-test/nalapps-paid-api'
          categories: |
            security
            performance
            accessibility
            general

      - name: Set up PHP and Composer
        if: steps.version.outputs.is_new == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: WPCS and dependency gate
        if: steps.version.outputs.is_new == 'true'
        run: |
          composer update --no-interaction --prefer-dist --no-progress
          composer audit
          find wordpress -name '*.php' ! -name '*.template.php' -print0 | xargs -0 -r -n1 php -l
          find build/self-test -name '*.php' -print0 | xargs -0 -r -n1 php -l
          find build/quality-contract -name '*.php' -print0 | xargs -0 -r -n1 php -l
          vendor/bin/phpcs --standard=phpcs.xml.dist build/self-test

      - name: Create immutable standard tag after validation
        if: steps.version.outputs.is_new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "NalApps WordPress Plugin Standard $TAG"
          git push origin "$TAG"
