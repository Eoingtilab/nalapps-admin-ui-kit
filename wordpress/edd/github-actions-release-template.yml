name: Tag and build plugin release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="my-plugin.php"
          version="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' "$MAIN_FILE" | head -n 1 | tr -d '\r')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "asset=my-plugin-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Create version tag when missing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "MY PLUGIN $TAG"
          git push origin "$TAG"

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Verify EDD SDK
        run: test -f vendor/easy-digital-downloads/edd-sl-sdk/edd-sl-sdk.php

      - name: Build WordPress distribution ZIP
        shell: bash
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail
          PLUGIN_DIR="my-plugin"
          rm -rf build
          mkdir -p "build/$PLUGIN_DIR"
          rsync -a ./ "build/$PLUGIN_DIR/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude '*.zip'
          cd build
          zip -qr "$ASSET" "$PLUGIN_DIR"
          test -s "$ASSET"

      - name: Create or update GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/$ASSET" --clobber
          else
            gh release create "$TAG" "build/$ASSET" --title "MY PLUGIN $TAG" --generate-notes
          fi
